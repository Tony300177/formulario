<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro Transporte Escolar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#eef3ff;
display:flex;
justify-content:center;
}

.container{
max-width:650px;
width:100%;
background:white;
margin:20px;
padding:25px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

h2{
text-align:center;
}

input,select{
width:100%;
padding:10px;
margin-top:6px;
margin-bottom:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

.gps{
background:#f39c12;
color:white;
}

.enviar{
background:#27ae60;
color:white;
}

.box{
background:#eef6ff;
padding:10px;
border-radius:6px;
margin-top:10px;
}

.msg{
margin-top:15px;
font-weight:bold;
color:green;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h2>Cadastro Transporte Escolar</h2>

<label>Responsável</label>
<input id="responsavel">

<label>Endereço</label>
<input id="endereco">

<label>Aluno</label>
<input id="aluno">

<label>Escola</label>
<select id="escola">
<option>E.E ARTUR ANTUNES MACIEL</option>
<option>CEM Dr. GUILHERME</option>
<option>EMR OSVALDO CRUZ</option>
<option>IFMT</option>
</select>

<label>Ano</label>
<select id="ano">
<option>1º ANO</option>
<option>2º ANO</option>
<option>3º ANO</option>
<option>4º ANO</option>
</select>

<label>Rota</label>
<select id="rota">
<option>ROTA 01</option>
<option>ROTA 02</option>
<option>ROTA 03</option>
</select>

<button class="gps" onclick="capturar()">📍 Capturar Localização</button>

<div class="box" id="local">
Latitude: - <br>
Longitude: -
</div>

<button class="enviar" onclick="enviar()">Enviar Registro</button>

<div class="msg" id="msg"></div>

</div>

<script>

const supabase = window.supabase.createClient(
"https://hqefobmvtojrwyoqgzak.supabase.co",
"sb_publishable_graMCVLAAM5yDapKLKrAhw_JXX0xvlZ"
)

let lat=null
let lon=null

function capturar(){

const campo=document.getElementById("local")

if(!navigator.geolocation){

campo.innerHTML="GPS não suportado"

return

}

campo.innerHTML="Capturando localização..."

navigator.geolocation.getCurrentPosition(

function(pos){

lat=pos.coords.latitude
lon=pos.coords.longitude

campo.innerHTML=
"Latitude: "+lat+
"<br>Longitude: "+lon

},

function(error){

campo.innerHTML="Erro ao capturar localização"

}

)

}

async function enviar(){

if(lat==null){

alert("Capture a localização primeiro")

return

}

const responsavel=document.getElementById("responsavel").value
const endereco=document.getElementById("endereco").value
const aluno=document.getElementById("aluno").value
const escola=document.getElementById("escola").value
const ano=document.getElementById("ano").value
const rota=document.getElementById("rota").value

const { error } = await supabase
.from("cadastro_transporte")
.insert([{
responsavel:responsavel,
endereco:endereco,
aluno:aluno,
escola:escola,
ano:ano,
rota:rota,
latitude:lat,
longitude:lon
}])

if(error){

alert("Erro ao enviar registro")

}else{

document.getElementById("msg").innerHTML="Registro enviado com sucesso!"

}

}

</script>

</body>
</html>
