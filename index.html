<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Transporte Escolar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;

background-image:url("https://images.unsplash.com/photo-1588072432836-e10032774350");
background-size:cover;
background-position:center;
}

.container{

max-width:500px;
margin:auto;
background:white;
margin-top:20px;
border-radius:10px;
box-shadow:0px 0px 15px rgba(0,0,0,0.3);

}

.header{

background:#004aad;
color:white;
padding:20px;
text-align:center;
border-radius:10px 10px 0 0;

}

.header img{

width:80px;
margin-bottom:10px;

}

.header h1{

margin:0;
font-size:20px;

}

.content{

padding:20px;

}

label{

font-weight:bold;
margin-top:10px;
display:block;

}

input,select{

width:100%;
padding:12px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
font-size:15px;

}

button{

width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;

}

.gps{

background:#f39c12;
color:white;

}

.enviar{

background:#27ae60;
color:white;

}

.info{

background:#eaf2ff;
padding:10px;
border-radius:6px;
font-size:14px;
margin-bottom:10px;

}

.msg{

text-align:center;
margin-top:15px;
font-weight:bold;
color:green;

}

footer{

text-align:center;
padding:10px;
font-size:13px;

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="logo.png">

<h1>CADASTRO DE TRANSPORTE ESCOLAR</h1>

</div>

<div class="content">

<div class="info">

Clique em <b>CAPTURAR LOCALIZAÇÃO</b> e aguarde 5 segundos antes de clicar em <b>ENVIAR</b>.

</div>

<label>Nome do Responsável</label>
<input id="responsavel">

<label>Fazenda / Sítio / Chácara</label>
<input id="endereco">

<label>Nome do Aluno</label>
<input id="aluno">

<label>Escola</label>

<select id="escola">

<option>E.E ARTUR ANTUNES MACIEL</option>
<option>CEM Dr. GUILHERME</option>
<option>CEM PROFESSOR ORLANDO PEREIRA</option>
<option>EMR OSVALDO CRUZ</option>
<option>EMR EUCLIDES DA CUNHA</option>
<option>EMR VINICIOS DE MORAIS</option>
<option>EE. ANTONIO FRANCISCO LISBOA</option>
<option>ANEXA RIO PRETO</option>
<option>ALVARES DE AZEVEDO</option>
<option>CORA CORALINA</option>
<option>IFMT</option>

</select>

<label>Ano Escolar</label>

<select id="ano">

<option>PRÉ I</option>
<option>PRÉ II</option>
<option>1º ANO</option>
<option>2º ANO</option>
<option>3º ANO</option>
<option>4º ANO</option>
<option>5º ANO</option>
<option>6º ANO</option>
<option>7º ANO</option>
<option>8º ANO</option>
<option>9º ANO</option>
<option>1º ANO ENSINO MÉDIO</option>
<option>2º ANO ENSINO MÉDIO</option>
<option>3º ANO ENSINO MÉDIO</option>

</select>

<label>Rota</label>

<select id="rota">

<option>ROTA 08/07/LISBOA</option>
<option>ROTA 09/07/LISBOA</option>
<option>ROTA FLOR DA SERRA/LISBOA</option>
<option>ROTA LINHA J/RIO PRETO/URBANO</option>
<option>ROTA 01/04/EUCLIDES</option>
<option>ROTA 01/04/LISBOA</option>
<option>ROTA 01/21/TERRA ROXA</option>

</select>

<button class="gps" onclick="gps()">CAPTURAR LOCALIZAÇÃO</button>

<button class="enviar" onclick="enviar()">ENVIAR REGISTRO</button>

<div class="msg" id="msg"></div>

</div>

<footer>

Desenvolvido pelo Departamento de Tecnologia da SME

</footer>

</div>

<script>

const supabase = supabase.createClient(
"SUA_URL_SUPABASE",
"SUA_CHAVE_SUPABASE"
)

let lat=""
let lon=""

function gps(){

navigator.geolocation.getCurrentPosition(pos=>{

lat=pos.coords.latitude
lon=pos.coords.longitude

alert("Localização capturada com sucesso!")

})

}

async function enviar(){

const responsavel=document.getElementById("responsavel").value
const endereco=document.getElementById("endereco").value
const aluno=document.getElementById("aluno").value
const escola=document.getElementById("escola").value
const ano=document.getElementById("ano").value
const rota=document.getElementById("rota").value

const {error}=await supabase
.from("cadastro_transporte")
.insert([{

responsavel,
endereco,
aluno,
escola,
ano,
rota,
latitude:lat,
longitude:lon

}])

if(error){

alert("Erro ao enviar")

}else{

document.getElementById("msg").innerHTML="Registro enviado com sucesso!"

}

}

</script>

</body>
</html>
