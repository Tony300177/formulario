<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro Transporte Escolar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
margin:0;
font-family:Segoe UI, Arial;
background:linear-gradient(135deg,#e8f2ff,#f4f7fb);
}

.container{
max-width:550px;
margin:auto;
background:white;
margin-top:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
overflow:hidden;
}

.header{
text-align:center;
padding:25px;
background:white;
border-bottom:1px solid #eee;
}

.logo{
width:120px;
padding:10px;
background:white;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.title{
font-size:22px;
margin-top:10px;
color:#333;
font-weight:bold;
}

.section{
padding:20px;
border-bottom:1px solid #eee;
}

.section-title{
font-size:16px;
font-weight:bold;
color:#2c3e50;
margin-bottom:10px;
}

label{
font-size:14px;
font-weight:600;
margin-top:10px;
display:block;
}

input,select{
width:100%;
padding:12px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
font-size:15px;
}

input:focus,select:focus{
border-color:#2b7cff;
outline:none;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
margin-top:12px;
}

.btn-gps{
background:#f39c12;
color:white;
}

.btn-add{
background:#3498db;
color:white;
}

.btn-enviar{
background:#27ae60;
color:white;
font-weight:bold;
}

.info{
background:#fff8e1;
padding:10px;
border-radius:6px;
font-size:14px;
margin-bottom:10px;
border:1px solid #ffe082;
}

.aluno-bloco{
background:#f9fbff;
padding:10px;
border-radius:6px;
margin-bottom:10px;
border:1px solid #d6e4ff;
}

.msg{
text-align:center;
margin-top:15px;
font-weight:bold;
color:green;
}

footer{
text-align:center;
font-size:13px;
padding:15px;
color:#555;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="logo.png" class="logo">

<div class="title">
CADASTRO DE TRANSPORTE ESCOLAR
</div>

</div>

<div class="section">

<div class="info">
Clique em <b>CAPTURAR LOCALIZAÇÃO</b>, aguarde cerca de 5 segundos e depois clique em <b>ENVIAR</b>.
</div>

</div>

<div class="section">

<div class="section-title">Responsável</div>

<label>Nome do Responsável</label>
<input id="responsavel" required>

<label>Fazenda / Sítio / Chácara</label>
<input id="endereco">

</div>

<div class="section">

<div class="section-title">Alunos</div>

<div id="listaAlunos"></div>

<button class="btn-add" onclick="adicionarAluno()">
+ Adicionar Aluno
</button>

</div>

<div class="section">

<button class="btn-gps" onclick="gps()">
📍 Capturar Localização
</button>

<button class="btn-enviar" onclick="enviar()">
✅ Enviar Cadastro
</button>

<div class="msg" id="msg"></div>

</div>

<footer>
Desenvolvido pelo Departamento de Tecnologia da SME
</footer>

</div>

<script>

const supabase = supabase.createClient(
"https://hqefobmvtojrwyoqgzak.supabase.co",
"sb_publishable_graMCVLAAM5yDapKLKrAhw_JXX0xvlZ"
)

let lat=""
let lon=""
let contador=0

function adicionarAluno(){

contador++

const bloco=`

<div class="aluno-bloco">

<label>Nome do Aluno</label>
<input id="aluno${contador}">

<label>Escola</label>
<select id="escola${contador}">
<option>E.E ARTUR ANTUNES MACIEL</option>
<option>CEM Dr. GUILHERME</option>
<option>CEM PROFESSOR ORLANDO PEREIRA</option>
<option>EMR OSVALDO CRUZ</option>
<option>EMR EUCLIDES DA CUNHA</option>
<option>EMR VINICIOS DE MORAIS</option>
<option>EE. ANTONIO FRANCISCO LISBOA</option>
<option>ANEXA RIO PRETO</option>
<option>ALVARES DE AZEVEDO</option>
<option>CORA CORALINA</option>
<option>IFMT</option>
</select>

<label>Ano</label>
<select id="ano${contador}">
<option>PRÉ I</option>
<option>PRÉ II</option>
<option>1º ANO</option>
<option>2º ANO</option>
<option>3º ANO</option>
<option>4º ANO</option>
<option>5º ANO</option>
<option>6º ANO</option>
<option>7º ANO</option>
<option>8º ANO</option>
<option>9º ANO</option>
<option>1º ANO ENSINO MÉDIO</option>
<option>2º ANO ENSINO MÉDIO</option>
<option>3º ANO ENSINO MÉDIO</option>
</select>

<label>Rota</label>
<select id="rota${contador}">
<option>ROTA 08/07/LISBOA</option>
<option>ROTA 09/07/LISBOA</option>
<option>ROTA FLOR DA SERRA/LISBOA</option>
<option>ROTA LINHA J/RIO PRETO/URBANO</option>
<option>ROTA 01/04/EUCLIDES</option>
<option>ROTA 01/04/LISBOA</option>
<option>ROTA 01/21/TERRA ROXA</option>
</select>

</div>

`

document.getElementById("listaAlunos").innerHTML+=bloco

}

function gps(){

navigator.geolocation.getCurrentPosition(pos=>{

lat=pos.coords.latitude
lon=pos.coords.longitude

alert("Localização capturada com sucesso!")

})

}

async function enviar(){

const responsavel=document.getElementById("responsavel").value
const endereco=document.getElementById("endereco").value

for(let i=1;i<=contador;i++){

const aluno=document.getElementById("aluno"+i).value
const escola=document.getElementById("escola"+i).value
const ano=document.getElementById("ano"+i).value
const rota=document.getElementById("rota"+i).value

await supabase
.from("cadastro_transporte")
.insert([{
responsavel,
endereco,
aluno,
escola,
ano,
rota,
latitude:lat,
longitude:lon
}])

}

document.getElementById("msg").innerHTML="Cadastro enviado com sucesso!"

}

</script>

</body>
</html>
