<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro Transporte Escolar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#eef3ff,#dfe9ff);
display:flex;
justify-content:center;
}

.container{

width:100%;
max-width:700px;
background:white;
margin:20px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.2);
overflow:hidden;

}

/* CABEÇALHO */

.header{

text-align:center;
padding:30px 20px;
background:white;
border-bottom:1px solid #eee;

}

/* LOGO MELHORADA */

.logo-box{

background:white;
padding:15px;
border-radius:12px;
display:inline-block;
box-shadow:0 6px 18px rgba(0,0,0,0.25);
margin-bottom:10px;

}

.logo{

width:200px;
max-width:90%;

}

.title{

font-size:24px;
font-weight:bold;
color:#2c3e50;
margin-top:10px;

}

.content{

padding:25px;

}

.section-title{

font-size:18px;
margin-top:20px;
margin-bottom:10px;
font-weight:bold;
color:#2c3e50;

}

label{

font-weight:bold;
font-size:14px;
margin-top:12px;
display:block;

}

input,select{

width:100%;
padding:12px;
border-radius:6px;
border:1px solid #ccc;
margin-top:5px;
font-size:15px;

}

input:focus,select:focus{

border-color:#2b7cff;
outline:none;

}

.info{

background:#fff8e1;
border:1px solid #ffe082;
padding:12px;
border-radius:6px;
font-size:14px;
margin-bottom:15px;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
margin-top:12px;

}

.btn-gps{

background:#f39c12;
color:white;

}

.btn-enviar{

background:#27ae60;
color:white;
font-weight:bold;

}

.coordenadas{

background:#eef6ff;
padding:10px;
margin-top:10px;
border-radius:6px;
font-size:14px;

}

.msg{

text-align:center;
margin-top:15px;
font-weight:bold;
color:green;

}

footer{

text-align:center;
padding:15px;
font-size:13px;
color:#555;

}

/* RESPONSIVO */

@media (max-width:600px){

.title{
font-size:20px;
}

.logo{
width:160px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="logo-box">
<img src="logo.png" class="logo">
</div>

<div class="title">
CADASTRO DE TRANSPORTE ESCOLAR
</div>

</div>

<div class="content">

<div class="info">
Clique em <b>CAPTURAR LOCALIZAÇÃO</b>, aguarde alguns segundos e depois clique em <b>ENVIAR</b>.
</div>

<div class="section-title">Responsável</div>

<label>Nome do Responsável</label>
<input id="responsavel">

<label>Fazenda / Sítio / Chácara</label>
<input id="endereco">

<div class="section-title">Aluno</div>

<label>Nome do Aluno</label>
<input id="aluno">

<label>Escola</label>

<select id="escola">

<option>E.E ARTUR ANTUNES MACIEL</option>
<option>CEM Dr. GUILHERME</option>
<option>CEM PROFESSOR ORLANDO PEREIRA</option>
<option>EMR OSVALDO CRUZ</option>
<option>EMR EUCLIDES DA CUNHA</option>
<option>EMR VINICIOS DE MORAIS</option>
<option>EE. ANTONIO FRANCISCO LISBOA</option>
<option>ANEXA RIO PRETO</option>
<option>ALVARES DE AZEVEDO</option>
<option>CORA CORALINA</option>
<option>IFMT</option>

</select>

<label>Ano Escolar</label>

<select id="ano">

<option>PRÉ I</option>
<option>PRÉ II</option>
<option>1º ANO</option>
<option>2º ANO</option>
<option>3º ANO</option>
<option>4º ANO</option>
<option>5º ANO</option>
<option>6º ANO</option>
<option>7º ANO</option>
<option>8º ANO</option>
<option>9º ANO</option>
<option>1º ANO ENSINO MÉDIO</option>
<option>2º ANO ENSINO MÉDIO</option>
<option>3º ANO ENSINO MÉDIO</option>

</select>

<label>Rota</label>

<select id="rota">

<option>ROTA 08/07/LISBOA</option>
<option>ROTA 09/07/LISBOA</option>
<option>ROTA FLOR DA SERRA/LISBOA</option>
<option>ROTA LINHA J/RIO PRETO/URBANO</option>
<option>ROTA 01/04/EUCLIDES</option>
<option>ROTA 01/04/LISBOA</option>
<option>ROTA 01/21/TERRA ROXA</option>
<option>ROTA 04/G/EUCLIDES</option>
<option>ROTA 05/CAIABI/LISBOA</option>
<option>ROTA 06/TODOS OS SANTOS/LISBOA</option>
<option>ROTA BARROSO/URBANO</option>
<option>ROTA BOI BOM/RIO AZUL/PARANÁ - OSVALDO CRUZ</option>
<option>ROTA BR 170 RIO PRETO FAZENDA AMALIA/URBANO</option>
<option>ROTA BR 170/VAN/URBANO</option>
<option>ROTA BR 174/03/TERRA ROXA</option>
<option>ROTA BR ARIPUANÃ / PARANÁ 02 - OSVALDO CRUZ</option>
<option>ROTA CAIABI/G/LISBOA</option>
<option>ROTA COMUNIDADE N.S. SALETE/LISBOA</option>
<option>ROTA F/USINA/TERRA ROXA</option>
<option>ROTA FONTANILLAS/URBANO</option>
<option>ROTA GLEBA RIO DO OURO/ GLEBA UNIÃO - OSVALDO CRUZ</option>

<option>ROTA IRACEMA 01 ROTA A - OSVALDO CRUZ</option>

</select>

<button class="btn-gps" onclick="gps()">📍 CAPTURAR LOCALIZAÇÃO</button>

<div class="coordenadas" id="localizacao">
Latitude: - <br>
Longitude: -
</div>

<button class="btn-enviar" onclick="enviar()">✅ ENVIAR REGISTRO</button>

<div class="msg" id="msg"></div>

</div>

<footer>
Desenvolvido pelo Departamento de Tecnologia da SME
</footer>

</div>

<script>

const supabase = supabase.createClient(
"https://hqefobmvtojrwyoqgzak.supabase.co",
"sb_publishable_graMCVLAAM5yDapKLKrAhw_JXX0xvlZ"
)

let lat=null
let lon=null

function gps(){

const local=document.getElementById("localizacao")

local.innerHTML="📡 Capturando localização..."

navigator.geolocation.getCurrentPosition(

function(pos){

lat=pos.coords.latitude
lon=pos.coords.longitude

local.innerHTML="📍 Latitude: "+lat+"<br>📍 Longitude: "+lon

},

function(){

local.innerHTML="❌ Permita o acesso à localização"

}

)

}

async function enviar(){

if(lat==null){

alert("Primeiro capture a localização")

return

}

const responsavel=document.getElementById("responsavel").value
const endereco=document.getElementById("endereco").value
const aluno=document.getElementById("aluno").value
const escola=document.getElementById("escola").value
const ano=document.getElementById("ano").value
const rota=document.getElementById("rota").value

const {error}=await supabase
.from("cadastro_transporte")
.insert([{

responsavel,
endereco,
aluno,
escola,
ano,
rota,
latitude:lat,
longitude:lon

}])

if(error){

alert("Erro ao enviar")

}else{

document.getElementById("msg").innerHTML="✅ Registro enviado com sucesso!"

}

}

</script>

</body>
</html>
